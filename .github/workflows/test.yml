name: Windows tests and portable build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: Build an internal evaluation portable package
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Install project without changing locked dependencies
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Unit and synthetic media integration tests
        run: python -m pytest -q
      - name: Build portable evaluation package
        if: github.event_name == 'workflow_dispatch' && inputs.package
        run: python scripts/build_portable.py
      - name: Upload portable evaluation package
        if: github.event_name == 'workflow_dispatch' && inputs.package
        uses: actions/upload-artifact@v4
        with:
          name: ScreenLite-windows-x64-evaluation
          path: |
            dist/ScreenLite-*-windows-x64.zip
            dist/ScreenLite-*-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
